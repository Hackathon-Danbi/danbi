spring.application.name=danbi
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/danbi
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 송금 (데모용 목업 값)
danbi.transfer.demo-password=1234
danbi.transfer.high-amount-threshold=1000000

# 가입 계좌 비밀번호 확인 (DB 계좌 자격증명 연동 전 프로토타입 값)
danbi.onboarding.prototype-account-password=1234
danbi.onboarding.prototype-one-won-code=4821

# 데모 신분증: 사진/OCR 검증 없이 가입 이름으로 예시 정보를 생성한다.
danbi.onboarding.demo-id-card-pass=true

# 선제적 도움 - 상담원 운영시간 (Asia/Seoul 기준)
danbi.help.agent.opens-at=09:00
danbi.help.agent.closes-at=18:00
danbi.help.agent.weekdays-only=true
danbi.help.agent.support-phone=1588-0000

# Agent reads the selected account from the existing MySQL banking tables.
danbi.agent.enabled=${DANBI_AGENT_ENABLED:false}
danbi.agent.api-key=${OPENAI_API_KEY:}
danbi.agent.text-model=${OPENAI_TEXT_MODEL:gpt-5.6-terra}
danbi.agent.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
danbi.agent.stt-model=${OPENAI_STT_MODEL:gpt-transcribe}
danbi.agent.tts-model=${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
danbi.agent.rag-min-score=${RAG_MIN_SCORE:0.35}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Defer parsing until handler argument resolution so controller-scoped advice can return the JSON error.
spring.servlet.multipart.resolve-lazily=true
# Drain rejected requests near the limit so clients can receive the JSON error response.
server.tomcat.max-swallow-size=4MB

# Server-side account selection, matching the existing prototype user convention.
danbi.agent.user-id=${AGENT_USER_ID:1}
danbi.agent.account-id=${AGENT_ACCOUNT_ID:1}

# Local DB credentials are excluded from Git; supports backend/ and repository-root launches.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
