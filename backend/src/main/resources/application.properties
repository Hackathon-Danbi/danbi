spring.application.name=danbi
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/danbi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=danbi
spring.datasource.password=danbi_local_pw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 송금 (데모용 목업 값)
danbi.transfer.demo-password=1234
danbi.transfer.high-amount-threshold=1000000

# 선제적 도움 - 상담원 운영시간 (Asia/Seoul 기준)
danbi.help.agent.opens-at=09:00
danbi.help.agent.closes-at=18:00
danbi.help.agent.weekdays-only=true
danbi.help.agent.support-phone=1588-0000
